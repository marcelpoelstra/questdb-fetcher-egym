services:
  questdb:
    image: questdb/questdb:10.0.1
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - questdb-data:/var/lib/questdb
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/exec?query=SELECT%201"]

  questdb-fetcher-egym:
    build: .
    restart: unless-stopped
    depends_on:
      questdb:
        condition: service_healthy
    environment:
      - QUESTDB_HOST=http://questdb:9000
      - EGYM_EMAIL
      - EGYM_PASSWORD
      - EGYM_BASE_URL
      - FETCH_INTERVAL_HOURS
      - FETCH_OVERLAP_DAYS
      # Uncomment the FETCH_RESET line only to reset the history, see "Resetting the history" in README.md.
      # Warning: delete-tables permanently removes the muscle imbalance, activity level
      # and ranking history, which cannot be fetched from EGYM again.
      # - FETCH_RESET

volumes:
  questdb-data:
